<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://pub-a58f169a0a2e4229af6efe323f6632e2.r2.dev; connect-src 'self' https://pub-a58f169a0a2e4229af6efe323f6632e2.r2.dev; base-uri 'self'; form-action 'none'; frame-ancestors 'none'">
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
	<meta http-equiv="Pragma" content="no-cache">
	<meta http-equiv="Expires" content="0">
	<title>3D-Aufnahmen – Übersicht</title>
	<link rel="icon" href="logo.svg" type="image/svg+xml">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
	<style>
		:root {
			--bg: #0a0d0f;
			--bg-2: #0e1316;
			--surface: #12181b;
			--surface-2: #1a2226;
			--border: rgba(255,255,255,.06);
			--text: #eef1f4;
			--text-dim: #93a0ab;
			--brand: #4a90d9;          /* Leitfarbe Blau */
			--brand-dim: #9cc5ee;
			/* einheitlicher Karten-Akzent (Blau) */
			--accent: #4a90d9;
			--accent-txt: #a9cef0;
			--accent-bg: rgba(74,144,217,.13);
			--accent-bg2: rgba(74,144,217,.24);
			--accent-glow: rgba(74,144,217,.42);
			--radius: 20px;
			--font: 'Lexend', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			--font-head: 'Fredoka', 'Lexend', sans-serif;
			font-family: var(--font);
		}
		* { box-sizing: border-box; margin: 0; padding: 0; }
		html { -webkit-text-size-adjust: 100%; }
		/* Buttons/Inputs erben Schriftart nicht automatisch vom body (Browser-Voreinstellung) */
		button, input { font-family: var(--font); }
		body {
			background: var(--bg);
			color: var(--text);
			min-height: 100vh;
			padding: 34px 22px 72px;
			-webkit-font-smoothing: antialiased;
			text-rendering: optimizeLegibility;
			position: relative;
			overflow-x: hidden;
		}
		/* Höhenlinien-Textur + grüner Glow im Hintergrund */
		.topo {
			position: fixed; inset: 0; width: 100%; height: 100%;
			z-index: -2; pointer-events: none; opacity: .9;
		}
		body::before {
			content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
			background:
				radial-gradient(900px 480px at 82% -8%, rgba(74,144,217,.12), transparent 60%),
				radial-gradient(760px 520px at 8% 108%, rgba(74,144,217,.07), transparent 60%);
		}

		.wrap { max-width: 1220px; margin: 0 auto; position: relative; }

		/* ---- Kopfbereich ---- */
		header {
			display: flex; align-items: center; gap: 18px;
			padding-bottom: 22px; margin-bottom: 18px;
			border-bottom: 1px solid var(--border);
		}
		header .logo { height: 54px; width: auto; display: block; flex: 0 0 auto; filter: drop-shadow(0 2px 8px rgba(0,0,0,.4)); }
		.head-text { flex: 1 1 auto; min-width: 0; }
		.eyebrow {
			font-size: 11.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
			color: var(--brand); margin-bottom: 6px;
		}
		h1 { font-family: var(--font-head); font-size: 33px; font-weight: 600; letter-spacing: -.01em; line-height: 1.04; }
		.sub { color: var(--text-dim); font-size: 14.5px; margin-top: 8px; max-width: 46ch; }
		.count-pill {
			flex: 0 0 auto;
			background: rgba(74,144,217,.1); border: 1px solid rgba(74,144,217,.32);
			color: var(--brand-dim); font-size: 13px; font-weight: 600;
			padding: 7px 13px; border-radius: 999px; white-space: nowrap;
		}
		.count-pill b { color: #fff; }

		/* ---- Sortieren (Icon-Button + Menü im Kopf) ---- */
		.header-right {
			display: flex; flex-direction: column; align-items: flex-end;
			justify-content: space-between; align-self: stretch; gap: 10px;
		}
		.sort-wrap { position: relative; }
		.header-tools { display: flex; align-items: center; gap: 2px; margin-bottom: -10px; }
		.icon-btn {
			background: none; border: none; padding: 6px; color: var(--text-dim);
			display: flex; align-items: center; justify-content: center; cursor: pointer;
			transition: color .12s;
		}
		.icon-btn:hover { color: var(--text); }
		.icon-btn.open, .icon-btn.active { color: var(--brand-dim); }
		.icon-btn svg { width: 24px; height: 24px; display: block; }

		/* Suchleiste (unter dem Kopf, per Lupe ein-/ausklappbar) */
		.searchbar {
			display: flex; align-items: center; gap: 10px;
			background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
			padding: 10px 14px; margin-bottom: 18px;
		}
		.searchbar[hidden] { display: none; }
		.search-ico { width: 18px; height: 18px; color: var(--text-dim); flex: 0 0 auto; }
		#searchInput {
			flex: 1 1 auto; min-width: 0; background: none; border: none; outline: none;
			color: var(--text); font-size: 14px; font-family: var(--font);
		}
		#searchInput::placeholder { color: var(--text-dim); }
		.search-clear {
			flex: 0 0 auto; background: none; border: none; color: var(--text-dim);
			font-size: 20px; line-height: 1; cursor: pointer; padding: 0 4px;
		}
		.search-clear:hover { color: var(--text); }
		.sort-menu {
			position: absolute; top: calc(100% + 8px); right: 0; z-index: 40;
			background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
			padding: 6px; min-width: 216px; display: flex; flex-direction: column; gap: 2px;
			box-shadow: 0 12px 30px -10px rgba(0,0,0,.6);
		}
		.sort-menu[hidden] { display: none; }   /* hidden-Attribut schlägt display:flex */
		.sort-opt {
			display: flex; align-items: center; gap: 8px; text-align: left; white-space: nowrap;
			background: none; border: none; cursor: pointer;
			color: var(--text-dim); font-size: 13px; font-weight: 500;
			padding: 9px 11px; border-radius: 8px;
		}
		.sort-opt:hover { background: rgba(255,255,255,.05); color: var(--text); }
		.sort-opt.active { color: var(--brand-dim); background: rgba(74,144,217,.1); }
		.chk { width: 12px; display: inline-block; opacity: 0; font-size: 11px; }
		.sort-opt.active .chk { opacity: 1; }

		/* ---- Grid ---- */
		.grid {
			display: grid; gap: 22px;
			grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
		}
		.card {
			position: relative; display: flex; flex-direction: column;
			background: var(--surface); border: 1px solid var(--border);
			border-radius: var(--radius); overflow: hidden;
			transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
		}
		.card:hover {
			transform: translateY(-4px);
			border-color: var(--accent);
			box-shadow: 0 18px 40px -16px var(--accent-glow), 0 8px 22px -14px rgba(0,0,0,.6);
		}

		/* Bild-Kachel mit Titel-Overlay */
		.thumb {
			position: relative; height: 178px;
			background: radial-gradient(circle at 50% 38%, #253038, #12181b);
			background-size: cover; background-position: center;
		}
		.ph {
			position: absolute; inset: 0; margin: auto; width: 62px; height: 62px; opacity: .45;
		}
		.title {
			font-family: var(--font-head);
			font-size: 20px; font-weight: 600; letter-spacing: -.005em; color: var(--text);
			line-height: 1.2; margin-bottom: 6px;
		}

		.body { padding: 14px 16px 16px; display: flex; flex-direction: column; flex: 1 1 auto; }
		.meta { font-size: 13px; line-height: 1.5; color: var(--text-dim); min-height: 1.2em; }
		.meta .pts { color: var(--text); font-weight: 600; }
		.meta .msep { opacity: .45; margin: 0 7px; }

		.actions { display: flex; gap: 9px; align-items: stretch; margin-top: 16px; }
		.vbtn {
			flex: 1 1 0; min-width: 0;
			display: inline-flex; align-items: center; justify-content: center; gap: 8px;
			padding: 11px 8px; border-radius: 10px; font-size: 14px; font-weight: 600;
			text-decoration: none; cursor: pointer; white-space: nowrap;
			background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.13); color: var(--text);
			transition: background .13s, border-color .13s, transform .08s;
		}
		.vbtn svg { width: 17px; height: 17px; flex: 0 0 auto; }
		.vbtn:hover { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.22); }
		.vbtn:active { transform: scale(.97); }
		/* 3D-Modell nur leicht hervorgehoben (blauer Akzent), nicht mehr gefüllt */
		.vbtn.primary { background: rgba(74,144,217,.1); border-color: rgba(74,144,217,.45); color: var(--brand-dim); }
		.vbtn.primary:hover { background: rgba(74,144,217,.18); border-color: var(--brand); }
		.act {
			flex: 1; text-align: center; text-decoration: none; cursor: pointer;
			padding: 11px 8px; border-radius: 12px; font-size: 13.5px; font-weight: 650;
			border: 1px solid var(--border); color: var(--text); background: var(--surface-2);
			transition: background .13s, border-color .13s, transform .08s, color .13s;
			display: inline-flex; align-items: center; justify-content: center; gap: 7px;
		}
		.act svg { width: 16px; height: 16px; }
		.act:hover { border-color: rgba(255,255,255,.16); background: #222c31; }
		.act:active { transform: scale(.97); }
		/* Primär-Aktion trägt die Akzentfarbe der Karte */
		.act.primary {
			background: var(--accent-bg); border-color: var(--accent); color: var(--accent-txt);
		}
		.act.primary:hover { background: var(--accent-bg2); border-color: var(--accent); }
		.act.share { flex: 0 0 auto; width: 50px; align-self: stretch; padding: 0; }

		.empty, .error { margin: 60px auto; color: var(--text-dim); text-align: center; font-size: 15px; }
		.error { color: #e0736b; }

		/* Skeleton */
		.sk { pointer-events: none; }
		.sk::before { background: var(--surface-2); }
		.sk .thumb { background: var(--surface-2); }
		.sk .ln { height: 12px; border-radius: 6px; background: var(--surface-2); margin-top: 11px; }
		.sk .ln.w60 { width: 60%; } .sk .ln.w90 { width: 90%; }
		@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
		.sk .thumb, .sk .ln { animation: pulse 1.3s ease-in-out infinite; }

		/* ---- Teilen-Dialog ---- */
		#share {
			position: fixed; inset: 0; background: rgba(4,6,7,.68);
			backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
			display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px;
		}
		#share.open { display: flex; }
		.share-box {
			position: relative; background: var(--surface); border: 1px solid var(--border);
			border-radius: 20px; padding: 26px; width: 350px; max-width: 100%;
			text-align: center; box-shadow: 0 24px 60px -20px rgba(0,0,0,.7);
		}
		.share-box h3 { font-size: 17px; margin-bottom: 18px; padding: 0 24px; font-weight: 680; }
		#share-x {
			position: absolute; top: 12px; right: 16px; background: none; border: none;
			color: var(--text-dim); font-size: 26px; line-height: 1; cursor: pointer; padding: 2px 6px;
		}
		#share-x:hover { color: #fff; }
		#qr { background: #fff; padding: 12px; border-radius: 14px; display: inline-block; }
		.share-url { color: var(--text-dim); font-size: 12px; word-break: break-all; margin: 15px 0; }
		.share-actions .act {
			width: 100%; background: rgba(74,144,217,.13); border-color: var(--brand); color: var(--brand-dim);
		}
		.share-actions .act:hover { background: rgba(74,144,217,.22); }

		@media (max-width: 560px) {
			body { padding: 20px 14px 56px; }
			header { gap: 12px; padding-bottom: 16px; margin-bottom: 14px; }
			header .logo { height: 44px; }
			.eyebrow { font-size: 9.5px; letter-spacing: .05em; margin-bottom: 3px; }
			h1 { font-size: 24px; }
			.sub { display: none; }               /* Untertitel auf dem Handy ausblenden -> weniger überladen */
			.count-pill { display: none; }        /* Zähler auf dem Handy weglassen -> Titel bekommt volle Breite */
			/* nur noch die Icons, vertikal zentriert -> flacher Kopf */
			.header-right { flex-direction: row; align-items: center; gap: 8px; align-self: center; }
			.header-tools { margin-bottom: 0; }
			.grid { gap: 16px; grid-template-columns: 1fr; }
		}

		/* Barrierefreiheit: Wer "Bewegung reduzieren" im System aktiviert hat,
		   bekommt keine dekorativen Animationen (Skelett-Puls, Karten-Anheben). */
		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after {
				animation-duration: .001ms !important;
				animation-iteration-count: 1 !important;
				transition-duration: .001ms !important;
			}
			.card:hover { transform: none; }
		}
	</style>
</head>
<body>
	<svg class="topo" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1200 800" aria-hidden="true">

	</svg>

	<div class="wrap">

						<svg viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true"><path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"/></svg>

							<button class="sort-opt" data-mode="date" data-dir="1" type="button"><span class="chk">✓</span>Datum · älteste zuerst</button>
						</div>

		</header>

		<div class="searchbar" id="searchbar" hidden>
			<svg class="search-ico" viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true"><path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"/></svg>
			<input type="text" id="searchInput" placeholder="Nach Name suchen…" autocomplete="off" enterkeyhint="search" inputmode="search">
			<button class="search-clear" id="searchClear" type="button" aria-label="Leeren">×</button>

		<div id="grid" class="grid"></div>
		<div id="status"></div>

	<div id="share">
		<div class="share-box">

	<script src="libs/qrcode.min.js"></script>
	<script>
		const R2_BASE = "https://pub-a58f169a0a2e4229af6efe323f6632e2.r2.dev";

		// Beta ist jetzt eigenständig: eigene view.html / model.html im selben Ordner.
		const VIEW_BASE = "";

		// ---- Höhenlinien-Hintergrund (Marching Squares über ein Höhenfeld) ----
		// Isolinien eines einzigen Höhenfeldes -> können sich nie kreuzen.
		// Grobes Gitter + Rauschen => leicht eckige ("zackige"), unregelmäßige Linien.
		// Deterministisch (feste Saat) -> bei jedem Laden identisch.
		(function buildTopo() {
			const g = document.getElementById("topoLines");
			if (!g) return;
			function mulberry32(a) {
				return function () {
					a |= 0; a = a + 0x6D2B79F5 | 0;
					let t = Math.imul(a ^ a >>> 15, 1 | a);
					t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
					return ((t ^ t >>> 14) >>> 0) / 4294967296;
				};
			}
			const rng = mulberry32(20260713);

			// Wertrauschen (3 Oktaven) für unregelmäßiges Gelände
			const perm = [...Array(256).keys()];
			for (let i = 255; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = perm[i]; perm[i] = perm[j]; perm[j] = t; }
			const gv = [...Array(256)].map(() => rng() * 2 - 1);
			const hash = (a, b) => gv[(perm[(a + perm[b & 255]) & 255]) & 255];
			function vnoise(x, y) {
				const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
				const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
				const aa = hash(xi, yi), ba = hash(xi + 1, yi), ab = hash(xi, yi + 1), bb = hash(xi + 1, yi + 1);
				const i1 = aa + u * (ba - aa), i2 = ab + u * (bb - ab);
				return i1 + v * (i2 - i1);
			}
			function noise(x, y) { let f = 0, amp = 1, fr = 1, n = 0; for (let o = 0; o < 3; o++) { f += amp * vnoise(x * fr, y * fr); n += amp; amp *= 0.5; fr *= 2; } return f / n; }

			// Höhenfeld = mehrere Gauß-„Hügel" + Rauschen
			const peaks = [
				{ x: 985, y: 105, a: 1.0, s: 300 }, { x: 150, y: 745, a: 0.95, s: 330 },
				{ x: 560, y: 470, a: 0.55, s: 235 }, { x: 1130, y: 650, a: 0.5, s: 240 },
				{ x: 110, y: 170, a: 0.5, s: 225 }, { x: 820, y: 770, a: 0.45, s: 210 }
			];
			const NS = 155, NAMP = 0.5;
			function H(x, y) {
				let h = 0;
				for (const p of peaks) { const dx = x - p.x, dy = y - p.y; h += p.a * Math.exp(-(dx * dx + dy * dy) / (2 * p.s * p.s)); }
				return h + NAMP * noise(x / NS, y / NS);
			}

			const W = 1200, HT = 800, COLS = 44, ROWS = 30, dx = W / COLS, dy = HT / ROWS;
			const val = [];
			let mn = Infinity, mx = -Infinity;
			for (let j = 0; j <= ROWS; j++) { val[j] = []; for (let i = 0; i <= COLS; i++) { const v = H(i * dx, j * dy); val[j][i] = v; if (v < mn) mn = v; if (v > mx) mx = v; } }

			// Marching-Squares-Fälle: Eckbits tl=1,tr=2,br=4,bl=8; Kanten 0=oben,1=rechts,2=unten,3=links
			const CASES = [[], [[3, 0]], [[0, 1]], [[3, 1]], [[1, 2]], [[3, 0], [1, 2]], [[0, 2]], [[3, 2]],
				[[2, 3]], [[2, 0]], [[0, 1], [2, 3]], [[2, 1]], [[1, 3]], [[1, 0]], [[0, 3]], []];
			function edgePt(edge, i, j, L) {
				const cx = [i * dx, (i + 1) * dx, (i + 1) * dx, i * dx];
				const cy = [j * dy, j * dy, (j + 1) * dy, (j + 1) * dy];
				const cv = [val[j][i], val[j][i + 1], val[j + 1][i + 1], val[j + 1][i]];
				const a = edge, b = (edge + 1) % 4;
				let t = (L - cv[a]) / (cv[b] - cv[a]); if (!isFinite(t)) t = 0.5; t = Math.max(0, Math.min(1, t));
				return (cx[a] + t * (cx[b] - cx[a])).toFixed(1) + " " + (cy[a] + t * (cy[b] - cy[a])).toFixed(1);
			}

			const NL = 13, lo = mn + (mx - mn) * 0.05, hi = mx - (mx - mn) * 0.02;
			let d = "";
			for (let l = 0; l < NL; l++) {
				const L = lo + (hi - lo) * l / (NL - 1);
				for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) {
					let idx = 0;
					if (val[j][i] > L) idx |= 1;
					if (val[j][i + 1] > L) idx |= 2;
					if (val[j + 1][i + 1] > L) idx |= 4;
					if (val[j + 1][i] > L) idx |= 8;
					const segs = CASES[idx];
					for (let s = 0; s < segs.length; s++) {
						d += "M" + edgePt(segs[s][0], i, j, L) + "L" + edgePt(segs[s][1], i, j, L);
					}
				}
			}
			g.innerHTML = '<path d="' + d + '"/>';
		})();

		const POINT_ICON = `<svg class="ph" viewBox="0 0 24 24" fill="none" stroke="#8fb8e0" stroke-width="1.5">
			<circle cx="6" cy="8" r="1.3"/><circle cx="11" cy="6" r="1.3"/><circle cx="17" cy="9" r="1.3"/>
			<circle cx="8" cy="13" r="1.3"/><circle cx="14" cy="12" r="1.3"/><circle cx="19" cy="15" r="1.3"/>
			<circle cx="5" cy="17" r="1.3"/><circle cx="11" cy="18" r="1.3"/><circle cx="16" cy="19" r="1.3"/></svg>`;
		const SHARE_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>';
		const CUBE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2l9 5v10l-9 5-9-5V7l9-5z"/><path d="M12 12l9-5M12 12v10M12 12L3 7"/></svg>';
		const LAYERS_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2l9 5-9 5-9-5 9-5z"/><path d="M3 12l9 5 9-5M3 17l9 5 9-5"/></svg>';
		const POINTS_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="7" r="1.5"/><circle cx="10.5" cy="4.8" r="1.5"/><circle cx="16.5" cy="7.2" r="1.5"/><circle cx="7" cy="12.2" r="1.5"/><circle cx="13" cy="11" r="1.5"/><circle cx="18.6" cy="13" r="1.5"/><circle cx="5.2" cy="17.3" r="1.5"/><circle cx="11" cy="18.4" r="1.5"/><circle cx="17.2" cy="18" r="1.5"/></svg>';

		function shareUrl(pc) {
			// Teilen ueber die OG-Vorschauseite (p/<name>.html) -> Rich-Vorschau (Bild+Titel)
			// in WhatsApp/Signal etc. Sie leitet automatisch auf view.html bzw. model.html weiter.
			return new URL("p/" + encodeURIComponent(pc.name) + ".html", location.href).href;
		}

		// Punktzahl & Datum: aus pointclouds.json (falls gesetzt), sonst live aus
		// metadata.json (points) + Last-Modified-Header (Erstellungs-/Upload-Datum).
		function fmtPoints(n) {
			if (n == null || !isFinite(n)) return null;
			if (n >= 1e6) return (n / 1e6).toLocaleString("de-DE", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + " Mio Punkte";
			if (n >= 1e4) return Math.round(n / 1e3).toLocaleString("de-DE") + " Tsd. Punkte";
			return n.toLocaleString("de-DE") + " Punkte";
		}
		function fmtTris(n) {
			if (n == null || !isFinite(n)) return null;
			if (n >= 1e6) return (n / 1e6).toLocaleString("de-DE", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + " Mio Dreiecke";
			if (n >= 1e4) return Math.round(n / 1e3).toLocaleString("de-DE") + " Tsd. Dreiecke";
			return n.toLocaleString("de-DE") + " Dreiecke";
		}
		function fmtDate(d) {
			if (!d) return null;
			const dt = new Date(d);
			if (isNaN(dt.getTime())) return (typeof d === "string" ? d : null); // bereits fertiger String erlaubt
			return dt.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" });
		}
		// Reichert einen Eintrag mit Punktzahl + Datum an (für Anzeige und Sortierung).
		async function enrich(pc) {
			let points = pc.points, dateRaw = pc.date;
			if (points == null || !dateRaw) {
				try {
					const r = await fetch(R2_BASE + "/" + encodeURIComponent(pc.name) + "/metadata.json?nocache=" + Date.now());
					if (r.ok) {
						if (!dateRaw) dateRaw = r.headers.get("last-modified");
						if (points == null) { const j = await r.json(); points = j.points; }
					}
				} catch (e) {}
			}
			// Modell-only-Projekte haben keine metadata.json -> Datum aus model.glb (Upload-Zeit)
			if (!dateRaw && pc.model) {
				try {
					const r = await fetch(R2_BASE + "/" + encodeURIComponent(pc.name) + "/model.glb?nocache=" + Date.now(), { method: "HEAD" });
					if (r.ok) dateRaw = r.headers.get("last-modified");
				} catch (e) {}
			}
			pc._points = points;
			pc._dateRaw = dateRaw;
			const dt = dateRaw ? new Date(dateRaw) : null;
			pc._dateVal = (dt && !isNaN(dt.getTime())) ? dt.getTime() : 0;
			return pc;
		}
		function metaHtml(pc) {
			const parts = [];
			const p = fmtPoints(pc._points); if (p) parts.push('<span class="pts">' + p + "</span>");
			const t = fmtTris(pc.tris); if (t) parts.push('<span class="pts">' + t + "</span>");
			const d = fmtDate(pc._dateRaw); if (d) parts.push("<span>" + d + "</span>");
			return parts.join('<span class="msep">·</span>');
		}

		function card(pc, i) {
			const div = document.createElement("div");
			div.className = "card";
			const enc = encodeURIComponent(pc.name);
			const hasPc = pc.pointcloud !== false;
			const pcBtn = '<a class="vbtn ghost" href="' + VIEW_BASE + 'view.html?p=' + enc + '">' + POINTS_ICON + 'Punktwolke</a>';
			const mdBtn = '<a class="vbtn primary" href="' + VIEW_BASE + 'model.html?p=' + enc + '">' + CUBE_ICON + '3D-Modell</a>';
			let btns;
			if (pc.model && hasPc) {
				// getauscht: links 3D-Modell (hervorgehoben), rechts Punktwolke
				btns = mdBtn + pcBtn;
			} else if (pc.model) {
				btns = mdBtn;
			} else {
				btns = pcBtn.replace("vbtn ghost", "vbtn primary");
			}
			const actions = btns + '<button class="act share" type="button" aria-label="Teilen" title="Teilen">' + SHARE_ICON + '</button>';

			const thumbStyle = pc.thumb ? ' style="background-image:url(\'' + R2_BASE + '/' + enc + '/thumb.jpg\')"' : '';

			div.innerHTML =
				'<div class="thumb"' + thumbStyle + '>' + (pc.thumb ? "" : POINT_ICON) + '</div>' +
				'<div class="body">' +
					'<h2 class="title"></h2>' +
					'<p class="meta"></p>' +
					'<div class="actions">' + actions + '</div>' +
				'</div>';
			div.querySelector(".title").textContent = pc.title || pc.name;
			div.querySelector(".share").addEventListener("click", () => openShare(pc));
			div.querySelector(".meta").innerHTML = metaHtml(pc);
			return div;
		}

		function skeleton() {
			const d = document.createElement("div");
			d.className = "card sk";
			d.innerHTML = '<div class="thumb"></div><div class="body"><div class="ln w90"></div><div class="ln w60"></div></div>';
			return d;
		}

		// --- Teilen-Dialog ---
		const shareEl = document.getElementById("share");
		let currentUrl = "";
		function openShare(pc) {
			currentUrl = shareUrl(pc);
			document.getElementById("share-title").textContent = pc.title || pc.name;
			document.getElementById("share-url").textContent = currentUrl;
			const qr = document.getElementById("qr");
			qr.innerHTML = "";
			if (window.QRCode) new QRCode(qr, { text: currentUrl, width: 220, height: 220 });
			shareEl.classList.add("open");
		}
		document.getElementById("share-x").addEventListener("click", () => shareEl.classList.remove("open"));
		shareEl.addEventListener("click", (e) => { if (e.target === shareEl) shareEl.classList.remove("open"); });
		document.addEventListener("keydown", (e) => { if (e.key === "Escape") shareEl.classList.remove("open"); });
		document.getElementById("share-copy").addEventListener("click", () => {
			const btn = document.getElementById("share-copy");
			navigator.clipboard.writeText(currentUrl)
				.then(() => { btn.textContent = "Kopiert!"; setTimeout(() => btn.textContent = "Link kopieren", 1500); })
				.catch(() => { btn.textContent = "Kopieren nicht möglich"; });
		});

		// --- Grid + Ladeskelett ---
		const grid = document.getElementById("grid");
		for (let i = 0; i < 6; i++) grid.appendChild(skeleton());

		// --- Sortierung + Suche ---
		let entries = [];
		let filterText = "";
		let sortMode = "date";   // beim Laden IMMER nach Datum
		let sortDir = -1;        // neueste zuerst; Umstellen nur ueber das Menue (Sitzung)

		const sortToggle = document.getElementById("sortToggle");
		const sortMenu = document.getElementById("sortMenu");
		const sortOpts = document.querySelectorAll(".sort-opt");
		function updateSortUI() {
			sortOpts.forEach(o => o.classList.toggle("active",
				o.dataset.mode === sortMode && parseInt(o.dataset.dir, 10) === sortDir));
		}
		function render() {
			const q = filterText.trim().toLowerCase();
			const list = q ? entries.filter(pc => (pc.title || pc.name).toLowerCase().includes(q)) : entries;
			const sorted = list.slice().sort((a, b) => {
				const cmp = (sortMode === "date")
					? a._dateVal - b._dateVal
					: (a.title || a.name).localeCompare(b.title || b.name, "de");
				return cmp * sortDir;
			});
			grid.innerHTML = "";
			const status = document.getElementById("status");
			if (!sorted.length) {
				status.className = "empty";
				status.textContent = q ? 'Keine Treffer für „' + filterText.trim() + '".' : "Noch keine Punktwolken vorhanden.";
			} else {
				status.className = ""; status.textContent = "";
				sorted.forEach(pc => grid.appendChild(card(pc)));
			}
			updateSortUI();
		}
		function closeSortMenu() { sortMenu.hidden = true; sortToggle.classList.remove("open"); }
		sortToggle.addEventListener("click", (e) => {
			e.stopPropagation();
			const willOpen = sortMenu.hidden;
			sortMenu.hidden = !willOpen;
			sortToggle.classList.toggle("open", willOpen);
		});
		sortOpts.forEach(o => o.addEventListener("click", () => {
			sortMode = o.dataset.mode;
			sortDir = parseInt(o.dataset.dir, 10);
			render();
			closeSortMenu();
		}));
		document.addEventListener("click", (e) => {
			if (!sortMenu.hidden && !e.target.closest(".sort-wrap")) closeSortMenu();
		});

		// --- Suche ---
		const searchToggle = document.getElementById("searchToggle");
		const searchbar = document.getElementById("searchbar");
		const searchInput = document.getElementById("searchInput");
		const searchClear = document.getElementById("searchClear");
		function closeSearch() {
			searchbar.hidden = true;
			searchToggle.classList.remove("active");
			searchInput.value = "";
			if (filterText) { filterText = ""; render(); }
		}
		searchToggle.addEventListener("click", () => {
			if (searchbar.hidden) { searchbar.hidden = false; searchToggle.classList.add("active"); searchInput.focus(); }
			else { closeSearch(); }
		});
		searchInput.addEventListener("input", () => { filterText = searchInput.value; render(); });
		// Enter auf Touch: Feld verlassen -> Bildschirmtastatur schliesst sich
		// (kein <form>, daher kein Standard-Submit; wir blurren selbst).
		searchInput.addEventListener("keydown", (e) => {
			if (e.key === "Enter") { e.preventDefault(); searchInput.blur(); }
		});
		searchClear.addEventListener("click", closeSearch);

		// --- Kopf beim Runterscrollen sanft ausblenden (an scrollY gekoppelt) ---
		const headerEl = document.querySelector("header");
		let fadeTicking = false;
		function applyHeaderFade() {
			const dist = headerEl.offsetHeight || 160;                 // Ausblenden über etwa eine Kopfhöhe
			const o = Math.max(0, Math.min(1, 1 - window.scrollY / dist));
			headerEl.style.opacity = o.toFixed(3);
			headerEl.style.pointerEvents = o < 0.05 ? "none" : "";     // unsichtbar -> nicht klickbar
			fadeTicking = false;
		}
		window.addEventListener("scroll", () => {
			if (!fadeTicking) { fadeTicking = true; requestAnimationFrame(applyHeaderFade); }
		}, { passive: true });
		applyHeaderFade();

		// --- Laden ---
		fetch("pointclouds.json?nocache=" + Date.now())
			.then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
			.then(data => {
				const list = (data && data.pointclouds) || [];
				if (list.length === 0) {
					grid.innerHTML = "";
					document.getElementById("status").className = "empty";
					document.getElementById("status").textContent = "Noch keine Punktwolken vorhanden.";
					return null;
				}
				const cnt = document.getElementById("count");
				cnt.innerHTML = "<b>" + list.length + "</b> Aufnahmen";
				cnt.hidden = false;
				return Promise.all(list.map(enrich));
			})
			.then(enriched => {
				if (!enriched) return;
				entries = enriched;
				document.getElementById("headerTools").hidden = false;
				render();
			})
			.catch(err => {
				grid.innerHTML = "";
				const s = document.getElementById("status");
				s.className = "error";
				s.textContent = "Liste konnte nicht geladen werden (" + err.message + ").";
			});
	</script>
</body>
</html>

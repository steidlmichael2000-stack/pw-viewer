<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
	<meta http-equiv="Pragma" content="no-cache">
	<meta http-equiv="Expires" content="0">
	<title>3D-Aufnahmen – Übersicht</title>
	<style>
		* { box-sizing: border-box; margin: 0; padding: 0; }
		body {
			background: #1a1d21;
			color: #e8e8e8;
			font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
			min-height: 100vh;
			padding: 24px 16px 48px;
		}
		header { max-width: 1100px; margin: 0 auto 24px; display: flex; align-items: center; gap: 14px; }
		header .logo { height: 46px; width: auto; display: block; flex: 0 0 auto; }
		h1 { font-size: 24px; font-weight: 600; }
		.sub { color: #9aa0a6; font-size: 14px; margin-top: 4px; }
		.grid {
			max-width: 1100px; margin: 0 auto;
			display: grid; gap: 16px;
			grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
		}
		.card {
			display: block; text-decoration: none; color: inherit;
			background: #24282e; border: 1px solid #333a42; border-radius: 12px;
			overflow: hidden; transition: transform .12s, border-color .12s;
		}
		.card:hover, .card:active { transform: translateY(-2px); border-color: #4a90d9; }
		.thumb {
			height: 140px; display: flex; align-items: center; justify-content: center;
			background: radial-gradient(circle at 50% 40%, #2f3843, #1c2127);
		}
		.thumb svg { width: 64px; height: 64px; opacity: .55; }
		.body { padding: 14px 16px 16px; }
		.title { font-size: 17px; font-weight: 600; }
		.desc { color: #9aa0a6; font-size: 13px; margin-top: 5px; line-height: 1.4; }
		.actions { display: flex; gap: 8px; margin-top: 12px; }
		.act {
			flex: 1; text-align: center; text-decoration: none;
			padding: 8px 6px; border-radius: 8px; font-size: 13px; font-weight: 600;
			border: 1px solid #3a4450; color: #e8e8e8; background: #2b3038;
		}
		.act.primary { background: #31465f; border-color: #4a90d9; color: #fff; }
		.act:active { background: #3a4a5e; }
		.empty, .error { max-width: 1100px; margin: 40px auto; color: #9aa0a6; text-align: center; }
		.error { color: #e0736b; }
		.act.share { flex: 0 0 auto; padding: 8px 12px; }
		.act.share svg { width: 16px; height: 16px; display: block; }
		/* Teilen-Dialog */
		#share { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none;
			align-items: center; justify-content: center; z-index: 100; padding: 16px; }
		#share.open { display: flex; }
		.share-box { position: relative; background: #24282e; border: 1px solid #3a4450;
			border-radius: 14px; padding: 20px; width: 320px; max-width: 100%; text-align: center; }
		.share-box h3 { font-size: 17px; margin-bottom: 14px; padding: 0 24px; }
		#share-x { position: absolute; top: 8px; right: 12px; background: none; border: none;
			color: #9aa0a6; font-size: 26px; line-height: 1; cursor: pointer; padding: 2px 6px; }
		#share-x:active { color: #fff; }
		#qr { background: #fff; padding: 10px; border-radius: 8px; display: inline-block; }
		.share-url { color: #9aa0a6; font-size: 12px; word-break: break-all; margin: 12px 0; }
		.share-actions { display: flex; }
		.share-actions .act { flex: 1; }
	</style>
</head>
<body>
	<header>
		<img src="logo.svg" alt="Logo" class="logo">
		<h1>3D-Aufnahmen</h1>
	</header>

	<div id="grid" class="grid"></div>
	<div id="status"></div>

	<div id="share">
		<div class="share-box">
			<button id="share-x" aria-label="Schließen">×</button>
			<h3 id="share-title"></h3>
			<div id="qr"></div>
			<div class="share-url" id="share-url"></div>
			<div class="share-actions">
				<button class="act primary" id="share-copy">Link kopieren</button>
			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
	<script>
		const POINT_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="#8fb8e0" stroke-width="1.5">
			<circle cx="6" cy="8" r="1.3"/><circle cx="11" cy="6" r="1.3"/><circle cx="17" cy="9" r="1.3"/>
			<circle cx="8" cy="13" r="1.3"/><circle cx="14" cy="12" r="1.3"/><circle cx="19" cy="15" r="1.3"/>
			<circle cx="5" cy="17" r="1.3"/><circle cx="11" cy="18" r="1.3"/><circle cx="16" cy="19" r="1.3"/></svg>`;

		const R2_BASE = "https://pub-a58f169a0a2e4229af6efe323f6632e2.r2.dev";
		const SHARE_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>';

		function shareUrl(pc) {
			// Vorschau-Seite mit Open-Graph-Bild (leitet zum Viewer weiter)
			return new URL("p/" + encodeURIComponent(pc.name) + ".html", location.href).href;
		}

		function card(pc) {
			const div = document.createElement("div");
			div.className = "card";
			const enc = encodeURIComponent(pc.name);
			let actions = '<a class="act primary" href="view.html?p=' + enc + '">Punktwolke</a>';
			if (pc.model) {
				actions += '<a class="act" href="model.html?p=' + enc + '">3D-Modell</a>';
			}
			actions += '<button class="act share" type="button" aria-label="Teilen" title="Teilen">' + SHARE_ICON + '</button>';
			const thumbHtml = pc.thumb
				? '<div class="thumb" style="background-image:url(\'' + R2_BASE + '/' + enc + '/thumb.jpg\');background-size:cover;background-position:center"></div>'
				: '<div class="thumb">' + POINT_ICON + '</div>';
			div.innerHTML =
				thumbHtml +
				'<div class="body">' +
					'<div class="title"></div>' +
					'<div class="desc"></div>' +
					'<div class="actions">' + actions + '</div>' +
				'</div>';
			div.querySelector(".title").textContent = pc.title || pc.name;
			div.querySelector(".desc").textContent = pc.description || "";
			div.querySelector(".share").addEventListener("click", () => openShare(pc));
			return div;
		}

		// --- Teilen-Dialog ---
		const shareEl = document.getElementById("share");
		let currentUrl = "";
		function openShare(pc) {
			currentUrl = shareUrl(pc);
			document.getElementById("share-title").textContent = pc.title || pc.name;
			document.getElementById("share-url").textContent = currentUrl;
			const qr = document.getElementById("qr");
			qr.innerHTML = "";
			if (window.QRCode) {
				new QRCode(qr, { text: currentUrl, width: 220, height: 220 });
			}
			shareEl.classList.add("open");
		}
		document.getElementById("share-x").addEventListener("click", () => shareEl.classList.remove("open"));
		shareEl.addEventListener("click", (e) => { if (e.target === shareEl) shareEl.classList.remove("open"); });
		document.getElementById("share-copy").addEventListener("click", () => {
			const btn = document.getElementById("share-copy");
			navigator.clipboard.writeText(currentUrl)
				.then(() => { btn.textContent = "Kopiert!"; setTimeout(() => btn.textContent = "Link kopieren", 1500); })
				.catch(() => { btn.textContent = "Kopieren nicht möglich"; });
		});

		fetch("pointclouds.json?nocache=" + Date.now())
			.then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
			.then(data => {
				const list = (data && data.pointclouds) || [];
				const grid = document.getElementById("grid");
				if (list.length === 0) {
					document.getElementById("status").className = "empty";
					document.getElementById("status").textContent = "Noch keine Punktwolken vorhanden.";
					return;
				}
				for (const pc of list) grid.appendChild(card(pc));
			})
			.catch(err => {
				const s = document.getElementById("status");
				s.className = "error";
				s.textContent = "Liste konnte nicht geladen werden (" + err.message + ").";
			});
	</script>
</body>
</html>

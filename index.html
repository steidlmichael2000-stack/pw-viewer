<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
	<meta http-equiv="Pragma" content="no-cache">
	<meta http-equiv="Expires" content="0">
	<title>Punktwolken-Viewer</title>

	<link rel="stylesheet" type="text/css" href="build/potree/potree.css">
	<link rel="stylesheet" type="text/css" href="libs/jquery-ui/jquery-ui.min.css">
	<link rel="stylesheet" type="text/css" href="libs/openlayers3/ol.css">
	<link rel="stylesheet" type="text/css" href="libs/spectrum/spectrum.css">
	<link rel="stylesheet" type="text/css" href="libs/jstree/themes/mixed/style.css">
</head>

<body>
	<script src="libs/jquery/jquery-3.1.1.min.js"></script>
	<script src="libs/spectrum/spectrum.js"></script>
	<script src="libs/jquery-ui/jquery-ui.min.js"></script>
	<script src="libs/other/BinaryHeap.js"></script>
	<script src="libs/tween/tween.min.js"></script>
	<script src="libs/d3/d3.js"></script>
	<script src="libs/proj4/proj4.js"></script>
	<script src="libs/openlayers3/ol.js"></script>
	<script src="libs/i18next/i18next.js"></script>
	<script src="libs/jstree/jstree.js"></script>
	<script src="build/potree/potree.js"></script>
	<script src="libs/plasio/js/laslaz.js"></script>

	<div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px;">
		<div id="potree_render_area" style="background-image: url('build/potree/resources/images/background.jpg');"></div>
		<div id="potree_sidebar_container"></div>
	</div>

	<script type="module">
		window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));

		viewer.setEDLEnabled(true);
		viewer.setFOV(60);
		viewer.setPointBudget(1_000_000);
		viewer.loadSettingsFromURL();
		viewer.setBackground("skybox");
		viewer.loadGUI(() => {
			viewer.setLanguage('de');
			$("#menu_tools").next().show();
			$("#menu_clipping").next().show();
			$("#potree_sidebar_container").hide();

			// Hamburger-Icon: zusätzlich die Sidebar wirklich ein-/ausblenden
			// (Potrees toggleSidebar schiebt nur die Render-Fläche, blendet
			// die Sidebar selbst aber nicht aus).
			$(".potree_menu_toggle").on("click", () => {
				$("#potree_sidebar_container").toggle();
			});
		});

		const R2_BASE = "https://pub-a58f169a0a2e4229af6efe323f6632e2.r2.dev";
		const DEFAULT_PC = "geckenheim";

		// Punktwolken-Name aus URL-Parameter ?p=<name> auslesen.
		// Nur Kleinbuchstaben/Ziffern/_/- erlaubt, sonst Default.
		const params = new URLSearchParams(window.location.search);
		const rawName = params.get("p") || DEFAULT_PC;
		const pcName = /^[a-z0-9_-]+$/.test(rawName) ? rawName : DEFAULT_PC;

		const POINTCLOUD_URL = `${R2_BASE}/${pcName}/metadata.json`;
		const displayName = pcName.charAt(0).toUpperCase() + pcName.slice(1);

		viewer.setDescription(`${displayName} — Drohnenaufnahme (WebODM)`);

		// Mehr Punkte gleichzeitig sichtbar (Standard 1 Mio.). Laedt feinere
		// Octree-Stufen -> kleinerer Punktabstand -> Potrees Nah-Sichtgrenze
		// (near plane = Punktabstand x N) sinkt -> man kommt naeher ran.
		viewer.setPointBudget(3_000_000);

		Potree.loadPointCloud(POINTCLOUD_URL, displayName, e => {
			let scene = viewer.scene;
			let pointcloud = e.pointcloud;
			let material = pointcloud.material;
			material.size = 2;
			material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
			material.shape = Potree.PointShape.SQUARE;

			scene.addPointCloud(pointcloud);
			viewer.fitToScreen();

			// =========================================================
			// Touch-Steuerung im Google-Earth-Stil (raycast-basiert)
			// =========================================================
			// Kern-Idee: Der Dreh-/Zoom-Mittelpunkt ("Pivot") ist NICHT
			// der Wuerfel-Mittelpunkt (der schwebt in der Luft), sondern
			// der ECHTE Oberflaechenpunkt unter den Fingern - per Raycast
			// in die Punktwolke ermittelt. Dadurch:
			//   - Zoom naehert sich der echten Oberflaeche (man kommt ran)
			//   - Pan-Tempo skaliert mit Abstand zur Oberflaeche (1:1-Gefuehl)
			//
			// Wir fangen Touch-Events vor Potree ab (capture + stopImmediate-
			// Propagation) und steuern die Kamera direkt ueber view.*.
			// Potrees OrbitControls.update() ist dann ein No-Op (alle Deltas 0).
			//
			// Gesten:  1 Finger = Pan | 2 Finger Pinch = Zoom
			//          2 Finger Drehen = Rotieren | 2 Finger vertikal = Neigen
			//
			// Feintuning live per URL: ?sens=zoom:1.5,pan:1,rot:1,pitch:1

			const VERSION = "v8";
			const renderArea = document.getElementById("potree_render_area");
			const canvas = viewer.renderer.domElement;

			// Sichtbares Versions-/Debug-Schild unten links. Zeigt, welche
			// Version wirklich geladen ist (gegen Cache-Verwirrung) und beim
			// Zoomen, ob der Pivot auf der OBERFLAECHE oder in der LUFT liegt.
			const badge = document.createElement("div");
			badge.style.cssText = "position:absolute;left:8px;bottom:8px;z-index:10000;" +
				"background:rgba(0,0,0,0.6);color:#0f0;font:12px monospace;" +
				"padding:4px 7px;border-radius:4px;pointer-events:none;white-space:pre;";
			badge.textContent = "PW " + VERSION;
			document.body.appendChild(badge);
			function setBadge(txt) { badge.textContent = "PW " + VERSION + "  " + txt; }

			const SENS = { zoom: 1.6, pan: 1.0, rot: 1.0, pitch: 1.0 };
			const sensParam = params.get("sens");
			if (sensParam) {
				for (const part of sensParam.split(",")) {
					const [k, v] = part.split(":");
					const num = parseFloat(v);
					if (k in SENS && isFinite(num)) SENS[k] = num;
				}
			}

			// Raycast: Bildschirm-Pixel (canvas-relativ) -> Oberflaechenpunkt.
			// Gibt Vector3 (THREE-Instanz, hat .clone/.sub/.add/...) oder null.
			function pickSurface(px, py) {
				const cam = viewer.scene.getActiveCamera();
				const I = Potree.Utils.getMousePointCloudIntersection(
					{x: px, y: py}, cam, viewer, viewer.scene.pointclouds, {pickClipped: false});
				return I ? I.location : null;
			}

			function canvasXY(t) {
				const r = canvas.getBoundingClientRect();
				return {x: t.clientX - r.left, y: t.clientY - r.top};
			}

			// Aktueller Gesten-Zustand: Pivot (Vector3) + letzte Fingerpositionen
			let pivot = null;
			let lastGoodPivot = null; // letzter erfolgreicher Oberflaechen-Treffer
			let last = new Map();
			let lastCount = 0;

			function beginGesture(ev) {
				const r = canvas.getBoundingClientRect();
				let cx = 0, cy = 0;
				for (const t of ev.touches) { cx += t.clientX - r.left; cy += t.clientY - r.top; }
				cx /= ev.touches.length; cy /= ev.touches.length;

				const hit = pickSurface(cx, cy);
				let src;
				if (hit) {
					pivot = hit;
					lastGoodPivot = hit.clone();
					src = "OBERFLAECHE z=" + Math.round(hit.z);
				} else if (lastGoodPivot) {
					pivot = lastGoodPivot.clone();
					src = "letzter Treffer z=" + Math.round(pivot.z);
				} else {
					// Notfall: Blickpunkt (kann in der Luft sein)
					pivot = viewer.scene.view.getPivot();
					src = "LUFT z=" + Math.round(pivot.z);
				}
				setBadge(ev.touches.length + "F  Pivot:" + src);
				last.clear();
				for (const t of ev.touches) last.set(t.identifier, canvasXY(t));
				lastCount = ev.touches.length;
			}

			const captureOpts = {capture: true, passive: false};

			renderArea.addEventListener('touchstart', (ev) => {
				ev.preventDefault();
				ev.stopImmediatePropagation();
				beginGesture(ev);
			}, captureOpts);

			renderArea.addEventListener('touchmove', (ev) => {
				ev.preventDefault();
				ev.stopImmediatePropagation();

				// Fingerzahl geaendert -> Geste neu aufsetzen (frischer Pivot)
				if (ev.touches.length !== lastCount || !pivot) {
					beginGesture(ev);
					return;
				}

				const view = viewer.scene.view;
				const h = renderArea.clientHeight;
				const camPos = view.position;
				const distToPivot = camPos.distanceTo(pivot);

				if (ev.touches.length === 1) {
					// --- 1 Finger: Pan entlang der Oberflaeche ---
					const t = ev.touches[0];
					const prev = last.get(t.identifier);
					const cur = canvasXY(t);
					if (prev) {
						// Weltgroesse eines Pixels in Pivot-Tiefe (exaktes 1:1-Tracking)
						const fovRad = viewer.getFOV() * Math.PI / 180;
						const worldPerPixel = 2 * distToPivot * Math.tan(fovRad / 2) / h;
						const dx = (cur.x - prev.x) * worldPerPixel * SENS.pan;
						const dy = (cur.y - prev.y) * worldPerPixel * SENS.pan;
						view.pan(-dx, dy);
					}
					last.set(t.identifier, cur);
				} else if (ev.touches.length === 2) {
					// --- 2 Finger: Zoom + Rotieren + Neigen, alles um den Pivot ---
					const t0 = ev.touches[0], t1 = ev.touches[1];
					const c0 = canvasXY(t0), c1 = canvasXY(t1);
					const p0 = last.get(t0.identifier), p1 = last.get(t1.identifier);
					if (p0 && p1) {
						const pdist = Math.hypot(p0.x - p1.x, p0.y - p1.y);
						const cdist = Math.hypot(c0.x - c1.x, c0.y - c1.y);
						const pang  = Math.atan2(p0.y - p1.y, p0.x - p1.x);
						const cang  = Math.atan2(c0.y - c1.y, c0.x - c1.x);
						const pcy   = (p0.y + p1.y) / 2;
						const ccy   = (c0.y + c1.y) / 2;

						// Pinch -> Zoom auf den Oberflaechen-Pivot zu/weg
						if (pdist > 10 && Math.abs(cdist - pdist) > 1) {
							const ratio = Math.pow(cdist / pdist, SENS.zoom);
							let newDist = distToPivot / ratio;
							newDist = Math.max(0.3, newDist); // nicht durch die Oberflaeche
							const move = distToPivot - newDist; // >0 = naeher ran
							const dir = pivot.clone().sub(camPos).normalize();
							camPos.add(dir.multiplyScalar(move));
						}

						// Twist -> Rotation um vertikale Achse durch den Pivot
						let dAng = cang - pang;
						while (dAng >  Math.PI) dAng -= 2 * Math.PI;
						while (dAng < -Math.PI) dAng += 2 * Math.PI;
						if (Math.abs(dAng) > 0.008) {
							const dYaw = dAng * SENS.rot;
							const zAxis = pivot.clone().set(0, 0, 1);
							const rel = view.position.clone().sub(pivot).applyAxisAngle(zAxis, dYaw);
							view.position.copy(pivot.clone().add(rel));
							view.yaw += dYaw;
						}

						// Vertikale Mittelpunkt-Bewegung -> Neigen (Pitch) um Pivot
						const dyMid = (ccy - pcy) / h;
						if (Math.abs(dyMid) > 0.004) {
							const dPitch = dyMid * SENS.pitch;
							const clamped = Math.max(-1.5, Math.min(1.5, view.pitch + dPitch));
							const applied = clamped - view.pitch;
							if (applied !== 0) {
								const side = view.getSide();
								const rel = view.position.clone().sub(pivot).applyAxisAngle(side, applied);
								view.position.copy(pivot.clone().add(rel));
								view.pitch = clamped;
							}
						}
					}
					last.set(t0.identifier, c0);
					last.set(t1.identifier, c1);
				}
			}, captureOpts);

			const endHandler = (ev) => {
				if (ev.cancelable) ev.preventDefault();
				ev.stopImmediatePropagation();
				if (ev.touches.length === 0) {
					pivot = null;
					last.clear();
					lastCount = 0;
				} else {
					beginGesture(ev); // Restfinger -> Geste neu aufsetzen
				}
			};
			renderArea.addEventListener('touchend', endHandler, captureOpts);
			renderArea.addEventListener('touchcancel', endHandler, captureOpts);

			// --- Desktop: Mausrad zoomt auf Punkt unter dem Cursor ---
			renderArea.addEventListener('wheel', (ev) => {
				ev.preventDefault();
				const r = canvas.getBoundingClientRect();
				const hit = pickSurface(ev.clientX - r.left, ev.clientY - r.top);
				const view = viewer.scene.view;
				const target = hit || view.getPivot();
				const camPos = view.position;
				const dist = camPos.distanceTo(target);
				const step = ev.deltaY < 0 ? 0.25 : -0.25; // rein / raus
				let newDist = Math.max(0.3, dist * (1 - step));
				const move = dist - newDist;
				const dir = target.clone().sub(camPos).normalize();
				camPos.add(dir.multiplyScalar(move));
			}, {passive: false, capture: true});
		});
	</script>
</body>
</html>

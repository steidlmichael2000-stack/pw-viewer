<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
	<title>3D-Modell</title>
	<style>
		* { box-sizing: border-box; margin: 0; padding: 0; }
		html, body { width: 100%; height: 100%; overflow: hidden; }
		/* Hintergrund liegt hinter dem transparenten Canvas */
		body { background: radial-gradient(circle at 50% 30%, #3a4453, #14171b); }
		body.bg-black { background: #000; }
		body.bg-white { background: #fff; }
		body.bg-gray { background: #808080; }
		#c { width: 100%; height: 100%; display: block; touch-action: none; position: relative; z-index: 1; }
		#title {
			position: absolute; top: 14px; left: 14px; right: 120px;
			color: #fff; font: 600 15px -apple-system,"Segoe UI",Roboto,sans-serif;
			text-shadow: 0 1px 3px rgba(0,0,0,.85); pointer-events: none; z-index: 5;
			white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
		}
		#back {
			position: absolute; right: 8px; top: 8px; z-index: 10;
			background: rgba(36,40,46,.85); color: #fff; font: 14px sans-serif;
			text-decoration: none; padding: 8px 12px; border-radius: 8px;
		}
		#loading {
			position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
			color: #cfd3d7; font: 15px -apple-system,"Segoe UI",Roboto,sans-serif; z-index: 8;
			background: #1a1d21;
		}
		#err { color: #e0736b; padding: 0 24px; text-align: center; }
		#fs {
			position: absolute; right: 12px; bottom: 12px; z-index: 10;
			width: 44px; height: 44px; border: none; border-radius: 10px; cursor: pointer;
			background: rgba(36,40,46,.85); color: #fff;
			display: flex; align-items: center; justify-content: center;
		}
		#fs svg { width: 22px; height: 22px; }
		/* Einstellungen (Zahnrad + Panel) */
		#pw-gear {
			position: absolute; left: 10px; top: 10px; z-index: 20;
			width: 46px; height: 46px; border: none; border-radius: 12px; cursor: pointer;
			background: rgba(36,40,46,0.85); color: #fff; font-size: 22px; line-height: 1;
			display: flex; align-items: center; justify-content: center;
		}
		#pw-gear:active { background: #31465f; }
		#pw-panel {
			position: absolute; left: 10px; top: 66px; z-index: 20;
			width: 220px; max-width: calc(100vw - 20px);
			background: rgba(36,40,46,0.94); color: #e8e8e8;
			border: 1px solid #3a4450; border-radius: 14px; padding: 14px 16px 16px;
			font-family: -apple-system,"Segoe UI",Roboto,sans-serif; font-size: 14px; display: none;
		}
		#pw-panel.open { display: block; }
		#pw-panel h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em;
			color: #9aa0a6; margin: 0 0 8px; font-weight: 600; }
		.pw-bg-row { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
		.pw-bg-btn { padding: 9px 6px; border: 1px solid #3a4450; border-radius: 9px;
			background: #2b3038; color: #e8e8e8; font-size: 13px; cursor: pointer; }
		.pw-bg-btn.active { border-color: #4a90d9; background: #31465f; color: #fff; }
	</style>
	<script type="importmap">
	{
		"imports": {
			"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
			"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
		}
	}
	</script>
</head>
<body>
	<canvas id="c"></canvas>
	<div id="title"></div>
	<a id="back" href="index.html">← Übersicht</a>
	<button id="pw-gear" aria-label="Einstellungen">&#9881;</button>
	<div id="pw-panel">
		<h3>Hintergrund</h3>
		<div class="pw-bg-row">
			<button class="pw-bg-btn" data-bg="gradient">Verlauf</button>
			<button class="pw-bg-btn" data-bg="black">Schwarz</button>
			<button class="pw-bg-btn" data-bg="white">Weiß</button>
			<button class="pw-bg-btn" data-bg="gray">Grau</button>
		</div>
	</div>
	<button id="fs" aria-label="Vollbild" title="Vollbild">
		<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
			<path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
	</button>
	<div id="loading">Modell wird geladen …</div>

	<script type="module">
		import * as THREE from 'three';
		import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
		import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
		import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

		const R2_BASE = "https://pub-a58f169a0a2e4229af6efe323f6632e2.r2.dev";
		const params = new URLSearchParams(location.search);
		const raw = params.get("p") || "";
		const pcName = /^[a-z0-9_-]+$/.test(raw) ? raw : "";
		const GLB_URL = pcName ? `${R2_BASE}/${pcName}/model.glb` : "";

		const loadingEl = document.getElementById("loading");
		function fail(msg) { loadingEl.innerHTML = '<div id="err">' + msg + '</div>'; }

		if (!GLB_URL) { fail("Kein Modell angegeben."); throw new Error("no model"); }

		// Projekt-Titel aus pointclouds.json
		fetch("pointclouds.json?nocache=" + Date.now())
			.then(r => r.ok ? r.json() : null)
			.then(d => {
				const e = d && (d.pointclouds || []).find(x => x.name === pcName);
				if (e) document.getElementById("title").textContent = e.title;
			}).catch(() => {});

		const canvas = document.getElementById("c");
		const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
		renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
		renderer.setSize(innerWidth, innerHeight);
		renderer.setClearAlpha(0);   // transparent -> CSS-Hintergrund (body) scheint durch
		renderer.outputColorSpace = THREE.SRGBColorSpace;

		const scene = new THREE.Scene(); // kein scene.background -> Canvas transparent

		// Hintergrund-Auswahl (per CSS am body), gespeichert
		function setBg(name) {
			document.body.classList.remove("bg-black", "bg-white", "bg-gray");
			if (name === "black") document.body.classList.add("bg-black");
			else if (name === "white") document.body.classList.add("bg-white");
			else if (name === "gray") document.body.classList.add("bg-gray");
			localStorage.setItem("pw_model_bg", name);
			document.querySelectorAll(".pw-bg-btn").forEach(b =>
				b.classList.toggle("active", b.dataset.bg === name));
		}
		const gear = document.getElementById("pw-gear");
		const panel = document.getElementById("pw-panel");
		gear.addEventListener("click", () => panel.classList.toggle("open"));
		document.querySelectorAll(".pw-bg-btn").forEach(b =>
			b.addEventListener("click", () => setBg(b.dataset.bg)));
		setBg(localStorage.getItem("pw_model_bg") || "gradient");

		const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100000);
		camera.up.set(0, 0, 1); // WebODM-Modelle sind Z-up (geografisch)

		// Licht: Himmel/Boden + Sonne, damit Texturen natuerlich wirken
		scene.add(new THREE.HemisphereLight(0xffffff, 0x556070, 2.2));
		const sun = new THREE.DirectionalLight(0xffffff, 1.6);
		sun.position.set(1, 1, 2);
		scene.add(sun);

		const controls = new OrbitControls(camera, canvas);
		controls.enableDamping = true;
		controls.dampingFactor = 0.08;

		const draco = new DRACOLoader();
		draco.setDecoderPath("https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/");
		const loader = new GLTFLoader();
		loader.setDRACOLoader(draco);

		loader.load(GLB_URL, (gltf) => {
			const model = gltf.scene;
			scene.add(model);

			// Modell zentrieren (grosse UTM-Koordinaten -> sonst Ruckeln durch Float-Ungenauigkeit)
			const box = new THREE.Box3().setFromObject(model);
			const center = box.getCenter(new THREE.Vector3());
			const size = box.getSize(new THREE.Vector3());
			model.position.sub(center);

			const radius = Math.max(size.x, size.y, size.z);
			controls.target.set(0, 0, 0);
			camera.position.set(radius * 0.6, -radius * 0.9, radius * 0.7);
			camera.near = radius / 1000;
			camera.far = radius * 100;
			camera.updateProjectionMatrix();
			controls.update();

			loadingEl.style.display = "none";
		}, (ev) => {
			if (ev.total) {
				const pct = Math.round(ev.loaded / ev.total * 100);
				loadingEl.textContent = "Modell wird geladen … " + pct + "%";
			}
		}, (e) => {
			fail("Modell konnte nicht geladen werden.<br>" + (e && e.message ? e.message : ""));
		});

		// Vollbild umschalten
		document.getElementById("fs").addEventListener("click", () => {
			if (document.fullscreenElement) document.exitFullscreen();
			else document.documentElement.requestFullscreen().catch(() => {});
		});

		addEventListener("resize", () => {
			camera.aspect = innerWidth / innerHeight;
			camera.updateProjectionMatrix();
			renderer.setSize(innerWidth, innerHeight);
		});

		(function animate() {
			requestAnimationFrame(animate);
			controls.update();
			renderer.render(scene, camera);
		})();
	</script>
</body>
</html>

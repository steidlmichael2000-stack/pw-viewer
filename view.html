<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
	<meta http-equiv="Pragma" content="no-cache">
	<meta http-equiv="Expires" content="0">
	<title>Punktwolken-Viewer</title>

	<link rel="stylesheet" type="text/css" href="build/potree/potree.css">
	<link rel="stylesheet" type="text/css" href="libs/jquery-ui/jquery-ui.min.css">
	<link rel="stylesheet" type="text/css" href="libs/openlayers3/ol.css">
	<link rel="stylesheet" type="text/css" href="libs/spectrum/spectrum.css">
	<link rel="stylesheet" type="text/css" href="libs/jstree/themes/mixed/style.css">
	<style>
		/* Potrees VR-Knopf und Hamburger ausblenden (nicht gebraucht) */
		#VRButton, .potree_menu_toggle { display: none !important; }

		/* Projekt-Titel: Kasten unten links (einheitlich mit den Knoepfen) */
		#potree_description {
			position: absolute !important;
			left: 12px !important; bottom: 12px !important;
			top: auto !important; right: auto !important; width: auto !important;
			max-width: calc(100vw - 80px) !important;
			text-align: left !important;
			background: rgba(36,40,46,0.85); color: #fff !important;
			font-family: -apple-system,"Segoe UI",Roboto,sans-serif !important;
			font-weight: 600 !important; font-size: 14px !important;
			padding: 8px 12px; border-radius: 8px; text-shadow: none;
			white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
		}

		/* Einstellungen: Zahnrad-Knopf oben links */
		#pw-gear {
			position: absolute; left: 10px; top: 10px; z-index: 10000;
			width: 46px; height: 46px; border: none; border-radius: 12px;
			background: rgba(36,40,46,0.85); color: #fff; font-size: 22px; line-height: 1;
			display: flex; align-items: center; justify-content: center; cursor: pointer;
			box-shadow: 0 2px 8px rgba(0,0,0,0.35);
		}
		#pw-gear:active { background: #31465f; }

		/* Einstellungs-Panel */
		#pw-panel {
			position: absolute; left: 10px; top: 66px; z-index: 10000;
			width: 240px; max-width: calc(100vw - 20px);
			background: rgba(36,40,46,0.94); color: #e8e8e8;
			border: 1px solid #3a4450; border-radius: 14px; padding: 14px 16px 16px;
			font-family: -apple-system,"Segoe UI",Roboto,sans-serif; font-size: 14px;
			box-shadow: 0 6px 20px rgba(0,0,0,0.4); display: none;
		}
		#pw-panel.open { display: block; }
		#pw-panel h3 {
			font-size: 12px; text-transform: uppercase; letter-spacing: .05em;
			color: #9aa0a6; margin: 0 0 8px; font-weight: 600;
		}
		#pw-panel h3:not(:first-child) { margin-top: 16px; }
		.pw-bg-row { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
		.pw-bg-btn {
			padding: 9px 6px; border: 1px solid #3a4450; border-radius: 9px;
			background: #2b3038; color: #e8e8e8; font-size: 13px; cursor: pointer;
			transition: background .12s, border-color .12s;
		}
		.pw-bg-btn.active { border-color: #4a90d9; background: #31465f; color: #fff; }
		#pw-zoom { width: 100%; accent-color: #4a90d9; margin-top: 2px; }
		#pw-zoomval { float: right; color: #6ab0f3; font-weight: 600; }
		#fs {
			position: absolute; right: 12px; bottom: 12px; z-index: 10000;
			width: 44px; height: 44px; border: none; border-radius: 10px; cursor: pointer;
			background: rgba(36,40,46,0.85); color: #fff;
			display: flex; align-items: center; justify-content: center;
		}
		#fs svg { width: 22px; height: 22px; }
	</style>
</head>

<body>
	<script src="libs/jquery/jquery-3.1.1.min.js"></script>
	<script src="libs/spectrum/spectrum.js"></script>
	<script src="libs/jquery-ui/jquery-ui.min.js"></script>
	<script src="libs/other/BinaryHeap.js"></script>
	<script src="libs/tween/tween.min.js"></script>
	<script src="libs/d3/d3.js"></script>
	<script src="libs/proj4/proj4.js"></script>
	<script src="libs/openlayers3/ol.js"></script>
	<script src="libs/i18next/i18next.js"></script>
	<script src="libs/jstree/jstree.js"></script>
	<script src="build/potree/potree.js"></script>
	<script src="libs/plasio/js/laslaz.js"></script>

	<div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px;">
		<div id="potree_render_area" style="background-image: url('build/potree/resources/images/background.jpg');"></div>
		<div id="potree_sidebar_container"></div>
	</div>

	<a href="index.html" style="position:absolute;right:8px;top:8px;z-index:10000;background:rgba(0,0,0,0.6);color:#fff;font:14px sans-serif;text-decoration:none;padding:8px 12px;border-radius:6px;">← Übersicht</a>

	<button id="fs" aria-label="Vollbild" title="Vollbild">
		<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
			<path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
	</button>
	<script>
		(function () {
			const fsBtn = document.getElementById("fs");
			const EXP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>';
			const CMP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3M16 3v3a2 2 0 0 0 2 2h3M8 21v-3a2 2 0 0 0-2-2H3M16 21v-3a2 2 0 0 1 2-2h3"/></svg>';
			fsBtn.addEventListener("click", () => {
				if (document.fullscreenElement) document.exitFullscreen();
				else document.documentElement.requestFullscreen().catch(() => {});
			});
			document.addEventListener("fullscreenchange", () => {
				fsBtn.innerHTML = document.fullscreenElement ? CMP : EXP;
			});
		})();
	</script>

	<script type="module">
		window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));

		viewer.setEDLEnabled(false);   // EDL vorsichtshalber aus (Android-Stabilitaet)
		viewer.setFOV(60);
		viewer.setPointBudget(1_000_000);
		viewer.loadSettingsFromURL();
		viewer.setBackground(localStorage.getItem("pw_bg") || "gradient");
		viewer.loadGUI(() => {
			viewer.setLanguage('de');
			$("#menu_tools").next().show();
			$("#menu_clipping").next().show();
			$("#potree_sidebar_container").hide();
			// Hamburger blendet Sidebar wirklich ein/aus (Potree schiebt sonst nur)
			$(".potree_menu_toggle").on("click", () => {
				$("#potree_sidebar_container").toggle();
			});
		});

		const R2_BASE = "https://pub-a58f169a0a2e4229af6efe323f6632e2.r2.dev";
		const DEFAULT_PC = "geckenheim";
		const params = new URLSearchParams(window.location.search);
		const rawName = params.get("p") || DEFAULT_PC;
		const pcName = /^[a-z0-9_-]+$/.test(rawName) ? rawName : DEFAULT_PC;
		const POINTCLOUD_URL = `${R2_BASE}/${pcName}/metadata.json`;
		const displayName = pcName.charAt(0).toUpperCase() + pcName.slice(1);
		// Titel oben mittig = Projektname aus der Uebersicht (pointclouds.json).
		// Bis geladen: leer (nicht der haessliche technische Name).
		viewer.setDescription("");
		fetch("pointclouds.json?nocache=" + Date.now())
			.then(r => r.ok ? r.json() : null)
			.then(d => {
				const entry = d && (d.pointclouds || []).find(x => x.name === pcName);
				viewer.setDescription(entry ? entry.title : "");
			})
			.catch(() => {});
		viewer.setPointBudget(3_000_000);

		Potree.loadPointCloud(POINTCLOUD_URL, displayName, e => {
			let scene = viewer.scene;
			let pointcloud = e.pointcloud;
			let material = pointcloud.material;
			material.size = 2;
			material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
			material.shape = Potree.PointShape.SQUARE;

			scene.addPointCloud(pointcloud);
			viewer.fitToScreen();

			// ============================================================
			// Touch-Steuerung "Objekt-Modus" (Trimble/Leica-Stil)
			// ============================================================
			// Wir fangen Touch-Events vor Potree ab und fuettern Potrees
			// EIGENE, erprobte OrbitControls mit Delta-Werten. Potrees
			// update() rechnet die Kamera daraus sicher -> KEIN Absturz,
			// KEINE selbstgebaute Kamera-Mathematik.
			//
			//   1 Finger                    = drehen / neigen (orbit)
			//   2 Finger auseinander/zu     = zoomen
			//   2 Finger zusammen schieben  = verschieben (pan)
			//
			// Kein 3-Finger. Feintuning per URL: ?sens=rot:1,zoom:1,pan:1

			const VERSION = "v23";   // nur intern (Deploy-Check), kein sichtbares Schild mehr
			const renderArea = document.getElementById("potree_render_area");
			const canvas = viewer.renderer.domElement;
			const oc = viewer.orbitControls;

			const SENS = { rot: 1.0, zoom: 4.0, pan: 1.0 };
			const sensParam = params.get("sens");
			if (sensParam) {
				for (const part of sensParam.split(",")) {
					const [k, v] = part.split(":");
					const n = parseFloat(v);
					if (k in SENS && isFinite(n)) SENS[k] = n;
				}
			}
			// Gespeicherten Zoom-Wert laden (falls vorhanden)
			const savedZoom = parseFloat(localStorage.getItem("pw_zoom2"));
			if (isFinite(savedZoom)) SENS.zoom = savedZoom;

			// --- Einstellungen: Zahnrad-Knopf (oben links) + Panel ---
			const gear = document.createElement("button");
			gear.id = "pw-gear";
			gear.type = "button";
			gear.innerHTML = "&#9881;"; // Zahnrad-Symbol
			gear.setAttribute("aria-label", "Einstellungen");
			document.body.appendChild(gear);

			const panel = document.createElement("div");
			panel.id = "pw-panel";
			panel.innerHTML =
				'<h3>Hintergrund</h3>' +
				'<div class="pw-bg-row">' +
					'<button class="pw-bg-btn" data-bg="skybox">Himmel</button>' +
					'<button class="pw-bg-btn" data-bg="gradient">Verlauf</button>' +
					'<button class="pw-bg-btn" data-bg="black">Schwarz</button>' +
					'<button class="pw-bg-btn" data-bg="white">Weiß</button>' +
				'</div>' +
				'<h3>Zoom-Tempo <span id="pw-zoomval"></span></h3>' +
				'<input id="pw-zoom" type="range" min="0.3" max="6" step="0.1">';
			document.body.appendChild(panel);

			gear.addEventListener("click", () => panel.classList.toggle("open"));

			// Hintergrund-Auswahl
			const bgBtns = panel.querySelectorAll(".pw-bg-btn");
			function setActiveBg(bg) {
				bgBtns.forEach(b => b.classList.toggle("active", b.dataset.bg === bg));
			}
			setActiveBg(localStorage.getItem("pw_bg") || "gradient");
			bgBtns.forEach(b => b.addEventListener("click", () => {
				viewer.setBackground(b.dataset.bg);
				localStorage.setItem("pw_bg", b.dataset.bg);
				setActiveBg(b.dataset.bg);
			}));

			// Zoom-Tempo-Regler (im Panel)
			const zoomSlider = panel.querySelector("#pw-zoom");
			const zoomVal = panel.querySelector("#pw-zoomval");
			zoomSlider.value = String(SENS.zoom);
			function updZoomLabel() { zoomVal.textContent = SENS.zoom.toFixed(1) + "x"; }
			updZoomLabel();
			zoomSlider.addEventListener("input", () => {
				SENS.zoom = parseFloat(zoomSlider.value);
				localStorage.setItem("pw_zoom2", String(SENS.zoom));
				updZoomLabel();
			});

			// Gesten auf Knopf/Panel nicht an den Viewer weiterreichen
			[gear, panel].forEach(el =>
				["touchstart", "touchmove", "touchend", "wheel", "pointerdown"].forEach(evt =>
					el.addEventListener(evt, e => e.stopPropagation())));

			const ROT_SPEED = 5; // entspricht Potrees interner rotationSpeed
			function canvasXY(t) {
				const r = canvas.getBoundingClientRect();
				return { x: t.clientX - r.left, y: t.clientY - r.top };
			}
			const last = new Map();
			let lastCount = 0;
			function remember(ev) {
				last.clear();
				for (const t of ev.touches) last.set(t.identifier, canvasXY(t));
				lastCount = ev.touches.length;
			}
			// Radius nie unter 0.3 m -> verhindert Durchfliegen/Degeneration
			function clampRadius() {
				const view = viewer.scene.view;
				if (view.radius + oc.radiusDelta < 0.3) oc.radiusDelta = 0.3 - view.radius;
			}

			const capOpts = { capture: true, passive: false };

			renderArea.addEventListener('touchstart', (ev) => {
				ev.preventDefault();
				ev.stopImmediatePropagation();
				remember(ev);
			}, capOpts);

			renderArea.addEventListener('touchmove', (ev) => {
				ev.preventDefault();
				ev.stopImmediatePropagation();
				if (ev.touches.length !== lastCount) { remember(ev); return; }

				const w = renderArea.clientWidth, h = renderArea.clientHeight;

				if (ev.touches.length === 1) {
					// 1 Finger -> drehen / neigen (Potrees Links-Drag-Verhalten)
					const t = ev.touches[0];
					const prev = last.get(t.identifier);
					const cur = canvasXY(t);
					if (prev) {
						oc.yawDelta   += (cur.x - prev.x) / w * ROT_SPEED * SENS.rot;
						oc.pitchDelta += (cur.y - prev.y) / h * ROT_SPEED * SENS.rot;
					}
					last.set(t.identifier, cur);
				} else if (ev.touches.length >= 2) {
					// 2 Finger -> zoomen (Abstand) + verschieben (Mittelpunkt)
					const view = viewer.scene.view;
					const t0 = ev.touches[0], t1 = ev.touches[1];
					const c0 = canvasXY(t0), c1 = canvasXY(t1);
					const p0 = last.get(t0.identifier), p1 = last.get(t1.identifier);
					if (p0 && p1) {
						const pdist = Math.hypot(p0.x - p1.x, p0.y - p1.y);
						const cdist = Math.hypot(c0.x - c1.x, c0.y - c1.y);

						// Zoom (Potree-Standardformel ueber radiusDelta)
						if (pdist > 10 && cdist > 1) {
							const delta = Math.pow(cdist / pdist, SENS.zoom);
							const resolved = view.radius + oc.radiusDelta;
							oc.radiusDelta = resolved / delta - resolved;
							clampRadius();
						}

						// Pan (Verschiebung des Finger-Mittelpunkts)
						const prevMx = (p0.x + p1.x) / 2, prevMy = (p0.y + p1.y) / 2;
						const curMx = (c0.x + c1.x) / 2, curMy = (c0.y + c1.y) / 2;
						oc.panDelta.x += (curMx - prevMx) / w * SENS.pan;
						oc.panDelta.y += (curMy - prevMy) / h * SENS.pan;

						last.set(t0.identifier, c0);
						last.set(t1.identifier, c1);
					}
				}
			}, capOpts);

			const endH = (ev) => {
				if (ev.cancelable) ev.preventDefault();
				ev.stopImmediatePropagation();
				if (ev.touches.length === 0) { last.clear(); lastCount = 0; }
				else remember(ev);
			};
			renderArea.addEventListener('touchend', endH, capOpts);
			renderArea.addEventListener('touchcancel', endH, capOpts);

			// Desktop: Mausrad -> zoomen (wie Potree-Scroll)
			renderArea.addEventListener('wheel', (ev) => {
				ev.preventDefault();
				const view = viewer.scene.view;
				const resolved = view.radius + oc.radiusDelta;
				const dir = ev.deltaY < 0 ? 1 : -1;
				oc.radiusDelta += -dir * resolved * 0.1 * SENS.zoom;
				clampRadius();
			}, { passive: false, capture: true });
		});
	</script>
</body>
</html>

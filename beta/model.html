<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
	<title>3D-Modell</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
	<style>
		:root {
			--ctrl-bg: rgba(15,20,23,.82);
			--ctrl-solid: rgba(15,20,23,.96);
			--ctrl-border: rgba(255,255,255,.09);
			--ctrl-shadow: 0 6px 20px rgba(0,0,0,.45);
			--accent: #4a90d9;
			--text: #eef1f4;
			--text-dim: #93a0ab;
			--font: 'Lexend',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
			--font-head: 'Fredoka','Lexend',sans-serif;
		}
		* { box-sizing: border-box; margin: 0; padding: 0; }
		html, body { width: 100%; height: 100%; overflow: hidden; }
		/* Hintergrund liegt hinter dem transparenten Canvas */
		body { background: radial-gradient(circle at 50% 32%, #1a232b, #0a0d0f); font-family: var(--font); }
		body.bg-black { background: #000; }
		body.bg-white { background: #fff; }
		body.bg-gray { background: #808080; }
		#c { width: 100%; height: 100%; display: block; touch-action: none; position: relative; z-index: 1; }

		/* Buttons/Inputs erben Schriftart nicht automatisch vom body (Browser-Voreinstellung) */
		button, input { font-family: var(--font); }

		/* Gemeinsamer Stil für die schwebenden Steuer-Knöpfe */
		#back, #fs, #pw-loc, #pw-gear {
			position: absolute; z-index: 10; width: 46px; height: 46px;
			border: 1px solid var(--ctrl-border); border-radius: 13px; cursor: pointer; text-decoration: none;
			background: var(--ctrl-bg); color: var(--text);
			display: flex; align-items: center; justify-content: center;
			box-shadow: var(--ctrl-shadow);
			-webkit-backdrop-filter: blur(9px); backdrop-filter: blur(9px);
			transition: background .13s, border-color .13s, transform .08s;
		}
		#back:hover, #fs:hover, #pw-loc:hover, #pw-gear:hover { border-color: var(--accent); }
		#back:active, #fs:active, #pw-loc:active, #pw-gear:active {
			background: #31465f; border-color: var(--accent); transform: scale(.95);
		}
		#back svg, #fs svg, #pw-loc svg { width: 23px; height: 23px; }

		#back    { right: 12px; top: 12px; }
		#pw-gear { left: 12px; top: 12px; z-index: 20; font-size: 22px; line-height: 1; }
		#fs      { right: 12px; bottom: 12px; }
		#pw-loc  { left: 12px; bottom: 12px; display: none; }
		#pw-loc.ready { display: flex; }

		#title {
			position: absolute; left: 50%; top: 12px; transform: translateX(-50%); z-index: 10;
			max-width: calc(100vw - 130px);
			background: var(--ctrl-bg); color: var(--text); text-align: center;
			font: 600 14px var(--font-head);
			padding: 11px 15px; border: 1px solid var(--ctrl-border); border-radius: 12px;
			box-shadow: var(--ctrl-shadow);
			-webkit-backdrop-filter: blur(9px); backdrop-filter: blur(9px);
			white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
		}
		#loading {
			position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
			color: #cfd3d7; font: 15px var(--font); z-index: 8;
			background: #0a0d0f;
		}
		#err { color: #e0736b; padding: 0 24px; text-align: center; }

		/* Einstellungs-Panel */
		#pw-panel {
			position: absolute; left: 12px; top: 68px; z-index: 20;
			width: 226px; max-width: calc(100vw - 24px);
			background: var(--ctrl-solid); color: var(--text);
			border: 1px solid var(--ctrl-border); border-radius: 16px; padding: 15px 16px 17px;
			font-family: var(--font); font-size: 14px; display: none;
			box-shadow: var(--ctrl-shadow);
			-webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
		}
		#pw-panel.open { display: block; }
		#pw-panel h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em;
			color: var(--text-dim); margin: 0 0 9px; font-weight: 700; }
		.pw-bg-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
		.pw-bg-btn { padding: 10px 6px; border: 1px solid var(--ctrl-border); border-radius: 10px;
			background: rgba(255,255,255,.04); color: var(--text); font-size: 13px; cursor: pointer;
			transition: background .12s, border-color .12s; }
		.pw-bg-btn:hover { background: rgba(255,255,255,.08); }
		.pw-bg-btn.active { border-color: var(--accent); background: #31465f; color: #fff; }
	</style>
	<script type="importmap">
	{
		"imports": {
			"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
			"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
		}
	}
	</script>
</head>
<body>
	<canvas id="c"></canvas>
	<div id="title"></div>
	<a id="back" href="index.html" aria-label="Übersicht" title="Übersicht">
		<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
			<path d="M19 12H5M12 19l-7-7 7-7"/></svg>
	</a>
	<a id="pw-loc" target="_blank" rel="noopener" aria-label="Auf Google Maps zeigen" title="Auf Google Maps zeigen">
		<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
			<path d="M12 21s-6-5.686-6-10a6 6 0 1 1 12 0c0 4.314-6 10-6 10z"/><circle cx="12" cy="11" r="2.5"/></svg>
	</a>
	<button id="pw-gear" aria-label="Einstellungen">&#9881;</button>
	<div id="pw-panel">
		<h3>Hintergrund</h3>
		<div class="pw-bg-row">
			<button class="pw-bg-btn" data-bg="gradient">Verlauf</button>
			<button class="pw-bg-btn" data-bg="black">Schwarz</button>
			<button class="pw-bg-btn" data-bg="white">Weiß</button>
			<button class="pw-bg-btn" data-bg="gray">Grau</button>
		</div>
		<h3 style="margin-top:16px">Ansicht</h3>
		<div class="pw-bg-row">
			<button class="pw-bg-btn pw-proj-btn" data-proj="perspective">Perspektive</button>
			<button class="pw-bg-btn pw-proj-btn" data-proj="ortho">Orthografisch</button>
		</div>
	</div>
	<button id="fs" aria-label="Vollbild" title="Vollbild">
		<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
			<path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
	</button>
	<div id="loading">Modell wird geladen …</div>

	<script type="module">
		import * as THREE from 'three';
		import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
		import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
		import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

		const R2_BASE = "https://pub-a58f169a0a2e4229af6efe323f6632e2.r2.dev";
		const params = new URLSearchParams(location.search);
		const raw = params.get("p") || "";
		const pcName = /^[a-z0-9_-]+$/.test(raw) ? raw : "";
		const GLB_URL = pcName ? `${R2_BASE}/${pcName}/model.glb` : "";

		const loadingEl = document.getElementById("loading");
		function fail(msg) { loadingEl.innerHTML = '<div id="err">' + msg + '</div>'; }

		if (!GLB_URL) { fail("Kein Modell angegeben."); throw new Error("no model"); }

		// Projekt-Titel aus pointclouds.json
		fetch("../pointclouds.json?nocache=" + Date.now())
			.then(r => r.ok ? r.json() : null)
			.then(d => {
				const e = d && (d.pointclouds || []).find(x => x.name === pcName);
				if (e) {
					document.getElementById("title").textContent = e.title;
					if (e.utmX != null && e.utmY != null) setMaps(Number(e.utmX), Number(e.utmY));
				}
			}).catch(() => {});

		// --- Standort-Knopf: Mitte der Punktwolke -> Google Maps ---
		// metadata.json enthaelt keine CRS-Angabe; WebODM-Aufnahmen in dieser
		// Region liegen in UTM Zone 32N (EPSG:32632). Zone hier bei Bedarf aendern.
		const UTM_ZONE = 32, UTM_NORTH = true;
		function utmToLatLon(easting, northing, zone, north) {
			const a = 6378137.0, f = 1 / 298.257223563;
			const e2 = f * (2 - f), ep2 = e2 / (1 - e2), k0 = 0.9996;
			const x = easting - 500000.0;
			const y = north ? northing : northing - 10000000.0;
			const M = y / k0;
			const mu = M / (a * (1 - e2 / 4 - 3 * e2 * e2 / 64 - 5 * e2 * e2 * e2 / 256));
			const e1 = (1 - Math.sqrt(1 - e2)) / (1 + Math.sqrt(1 - e2));
			const fp = mu + (3 * e1 / 2 - 27 * e1 ** 3 / 32) * Math.sin(2 * mu)
				+ (21 * e1 ** 2 / 16 - 55 * e1 ** 4 / 32) * Math.sin(4 * mu)
				+ (151 * e1 ** 3 / 96) * Math.sin(6 * mu)
				+ (1097 * e1 ** 4 / 512) * Math.sin(8 * mu);
			const C1 = ep2 * Math.cos(fp) ** 2, T1 = Math.tan(fp) ** 2;
			const R1 = a * (1 - e2) / Math.pow(1 - e2 * Math.sin(fp) ** 2, 1.5);
			const N1 = a / Math.sqrt(1 - e2 * Math.sin(fp) ** 2);
			const D = x / (N1 * k0);
			const lat = fp - (N1 * Math.tan(fp) / R1) * (D * D / 2
				- (5 + 3 * T1 + 10 * C1 - 4 * C1 * C1 - 9 * ep2) * D ** 4 / 24
				+ (61 + 90 * T1 + 298 * C1 + 45 * T1 * T1 - 3 * C1 * C1 - 252 * ep2) * D ** 6 / 720);
			const lonRad = (D - (1 + 2 * T1 + C1) * D ** 3 / 6
				+ (5 - 2 * C1 + 28 * T1 - 3 * C1 * C1 + 8 * ep2 + 24 * T1 * T1) * D ** 5 / 120) / Math.cos(fp);
			const lon0 = (zone * 6 - 183) * Math.PI / 180;
			return [lat * 180 / Math.PI, (lon0 + lonRad) * 180 / Math.PI];
		}
		let mapsSet = false;
		function setMaps(cx, cy) {
			if (mapsSet || !isFinite(cx) || !isFinite(cy)) return;
			const [lat, lon] = utmToLatLon(cx, cy, UTM_ZONE, UTM_NORTH);
			if (!isFinite(lat) || !isFinite(lon)) return;
			const loc = document.getElementById("pw-loc");
			loc.href = `https://www.google.com/maps/search/?api=1&query=${lat.toFixed(6)},${lon.toFixed(6)}`;
			loc.classList.add("ready");
			mapsSet = true;
		}
		fetch(`${R2_BASE}/${pcName}/metadata.json?nocache=` + Date.now())
			.then(r => r.ok ? r.json() : null)
			.then(m => {
				const bb = m && m.boundingBox;
				if (!bb || !bb.min || !bb.max) return;
				const cx = (bb.min[0] + bb.max[0]) / 2, cy = (bb.min[1] + bb.max[1]) / 2;
				setMaps(cx, cy);
			})
			.catch(() => {});

		const canvas = document.getElementById("c");
		const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
		renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
		renderer.setSize(innerWidth, innerHeight);
		renderer.setClearAlpha(0);   // transparent -> CSS-Hintergrund (body) scheint durch
		renderer.outputColorSpace = THREE.SRGBColorSpace;

		const scene = new THREE.Scene(); // kein scene.background -> Canvas transparent

		// Hintergrund-Auswahl (per CSS am body), gespeichert
		function setBg(name) {
			document.body.classList.remove("bg-black", "bg-white", "bg-gray");
			if (name === "black") document.body.classList.add("bg-black");
			else if (name === "white") document.body.classList.add("bg-white");
			else if (name === "gray") document.body.classList.add("bg-gray");
			localStorage.setItem("pw_model_bg", name);
			document.querySelectorAll("[data-bg]").forEach(b =>
				b.classList.toggle("active", b.dataset.bg === name));
		}
		const gear = document.getElementById("pw-gear");
		const panel = document.getElementById("pw-panel");
		gear.addEventListener("click", () => panel.classList.toggle("open"));
		document.querySelectorAll("[data-bg]").forEach(b =>
			b.addEventListener("click", () => setBg(b.dataset.bg)));
		setBg(localStorage.getItem("pw_model_bg") || "gradient");

		const FOV = 60;
		const camera = new THREE.PerspectiveCamera(FOV, innerWidth / innerHeight, 0.1, 100000);
		camera.up.set(0, 0, 1); // WebODM-Modelle sind Z-up (geografisch)
		// Zweite Kamera fuer orthografische Ansicht (Frustum wird beim Umschalten gesetzt)
		const orthoCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100000);
		orthoCam.up.set(0, 0, 1);
		let activeCamera = camera;

		// Licht: Himmel/Boden + Sonne, damit Texturen natuerlich wirken
		scene.add(new THREE.HemisphereLight(0xffffff, 0x556070, 2.2));
		const sun = new THREE.DirectionalLight(0xffffff, 1.6);
		sun.position.set(1, 1, 2);
		scene.add(sun);

		const controls = new OrbitControls(camera, canvas);
		controls.enableDamping = true;
		controls.dampingFactor = 0.08;

		// Ansicht: Perspektive / Orthografisch. Beim Umschalten Blickrichtung und
		// sichtbare Groesse beibehalten, damit der Wechsel nahtlos aussieht.
		const HALF_FOV_TAN = Math.tan(THREE.MathUtils.degToRad(FOV / 2));
		const projBtns = document.querySelectorAll("[data-proj]");
		let projMode = "perspective";
		function setProjection(mode) {
			mode = (mode === "ortho") ? "ortho" : "perspective";
			projBtns.forEach(b => b.classList.toggle("active", b.dataset.proj === mode));
			localStorage.setItem("pw_model_proj", mode);
			if (mode === projMode) return;
			const from = activeCamera;
			const dir = new THREE.Vector3().subVectors(from.position, controls.target);
			const dist = dir.length() || 1;
			const aspect = innerWidth / innerHeight;
			if (mode === "ortho") {
				const half = HALF_FOV_TAN * dist;              // sichtbare Halbhoehe der Perspektive
				orthoCam.position.copy(from.position);
				orthoCam.up.copy(from.up);
				orthoCam.top = half; orthoCam.bottom = -half;
				orthoCam.left = -half * aspect; orthoCam.right = half * aspect;
				orthoCam.zoom = 1;
				orthoCam.near = camera.near; orthoCam.far = camera.far;
				orthoCam.updateProjectionMatrix();
			} else {
				const effHalf = orthoCam.top / orthoCam.zoom;  // aktuelle sichtbare Halbhoehe (inkl. Zoom)
				dir.setLength(effHalf / HALF_FOV_TAN);
				camera.position.copy(controls.target).add(dir);
				camera.up.copy(from.up);
				camera.updateProjectionMatrix();
			}
			activeCamera = (mode === "ortho") ? orthoCam : camera;
			controls.object = activeCamera;
			controls.update();
			projMode = mode;
		}
		projBtns.forEach(b => b.addEventListener("click", () => setProjection(b.dataset.proj)));

		const draco = new DRACOLoader();
		draco.setDecoderPath("https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/");
		const loader = new GLTFLoader();
		loader.setDRACOLoader(draco);

		loader.load(GLB_URL, (gltf) => {
			const model = gltf.scene;
			scene.add(model);

			// Modell zentrieren (grosse UTM-Koordinaten -> sonst Ruckeln durch Float-Ungenauigkeit)
			const box = new THREE.Box3().setFromObject(model);
			const center = box.getCenter(new THREE.Vector3());
			const size = box.getSize(new THREE.Vector3());
			model.position.sub(center);

			const radius = Math.max(size.x, size.y, size.z);
			controls.target.set(0, 0, 0);
			camera.position.set(radius * 0.6, -radius * 0.9, radius * 0.7);
			camera.near = radius / 1000;
			camera.far = radius * 100;
			camera.updateProjectionMatrix();
			controls.update();

			// Gespeicherte Ansicht (Perspektive/Ortho) anwenden, jetzt ist die Kamera gesetzt
			setProjection(localStorage.getItem("pw_model_proj") || "perspective");

			loadingEl.style.display = "none";
		}, (ev) => {
			if (ev.total) {
				const pct = Math.round(ev.loaded / ev.total * 100);
				loadingEl.textContent = "Modell wird geladen … " + pct + "%";
			}
		}, (e) => {
			fail("Modell konnte nicht geladen werden.<br>" + (e && e.message ? e.message : ""));
		});

		// Vollbild umschalten + Symbol wechseln (aufziehen <-> verkleinern)
		const fsBtn = document.getElementById("fs");
		const ICON_EXPAND = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>';
		const ICON_COMPRESS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3M16 3v3a2 2 0 0 0 2 2h3M8 21v-3a2 2 0 0 0-2-2H3M16 21v-3a2 2 0 0 1 2-2h3"/></svg>';
		fsBtn.addEventListener("click", () => {
			if (document.fullscreenElement) document.exitFullscreen();
			else document.documentElement.requestFullscreen().catch(() => {});
		});
		document.addEventListener("fullscreenchange", () => {
			fsBtn.innerHTML = document.fullscreenElement ? ICON_COMPRESS : ICON_EXPAND;
		});

		addEventListener("resize", () => {
			const aspect = innerWidth / innerHeight;
			camera.aspect = aspect;
			camera.updateProjectionMatrix();
			const halfH = orthoCam.top;
			orthoCam.left = -halfH * aspect;
			orthoCam.right = halfH * aspect;
			orthoCam.updateProjectionMatrix();
			renderer.setSize(innerWidth, innerHeight);
		});

		(function animate() {
			requestAnimationFrame(animate);
			controls.update();
			renderer.render(scene, activeCamera);
		})();
	</script>
</body>
</html>
